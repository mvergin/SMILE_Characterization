# Annotated example config for measure_iqe.
#
#   python -m measure_iqe --config config.example.yaml
#   IQEConfig.from_file("config.example.yaml")
#
# EVERY key is optional: leave one out and the default in measure_iqe/config.py
# applies. An unknown key or a wrong type is a hard error, so a typo can never be
# silently ignored. The values below ARE the defaults, so this file reproduces a
# stock run. Full parameter reference: README.md -> Configuration reference.


# ---- Run identity & output ----
sample_name: "Array38_IQE"   # base_dir is relative to the working directory unless you pass an absolute path. ...
base_dir: "results"   # output root; a timestamped run dir is created inside

# ---- ROI & pixel selection ----
roi: [32, 32, 63, 63]   # (x1,y1,x2,y2) or "FULL"/"TL"/"TR"/"BL"/"BR"
sweep_select: "blocks"   # "blocks" | "spatial" | "stride"
block_size: 8   # blocks mode: block edge in pixels (ROI → ~ROI/BLOCK_SIZE blocks/axis)
pixels_per_block: 4   # blocks mode: alive pixels sampled per block
block_seed: 0   # blocks mode: RNG seed (vary across runs to sample new pixels)
min_pixel_separation: 2   # blocks mode: no two measured pixels may sit closer than this (Chebyshev, so 2 = never ...
sweep_fraction: 0.1   # spatial mode: fraction of ALIVE pixels to sweep
min_sweep_pixels: 6   # spatial mode: floor on the count (so tiny ROIs still map)
nth_pixel_sweep: 5   # stride mode: sweep every Nth alive pixel
max_sweep_pixels: 40   # hard cap (spatial/stride only; blocks controls its own count)
fastscan_bitval: 15   # bitval for the alive/dead fast scan (brightest)

# ---- Source mode ----
source_mode: "voltage"   # "voltage": ch B sources voltage, adaptive current-targeted sweep. PROVEN on Array38 — ...

# ---- Current-source sweep (source_mode = "current") ----
current_sweep_low_a: 3.0e-07   # lowest LED current setpoint (1 µA → J ≈ 1)
current_sweep_high_a: 0.00012   # highest setpoint (~120 µA; capped by V compliance)
current_sweep_n: 50   # log-spaced current setpoints
nvled_v_limit: 3.2   # |voltage| compliance while sourcing current (V)
current_sweep_bitval: 15   # single bitval — CMOS fully open, we set I directly
current_source_range_i: 0.001   # fixed source current range (covers 120 µA; gives good low-current resolution). Tune on ...
measure_v_range: 6.0   # ch B voltage measure range (covers ±3.2 V)

# ---- Voltage-source sweep (source_mode = "voltage", DEFAULT) ----
bitvals: [15]   # single bitval — densify low-J via spacing instead
fine_sweep_mode: "voltage"   # Fine-sweep mode: "voltage" — plain UNIFORM voltage ramp NVLED_V_COARSE_START → STOP ...
nvled_v_coarse_start: -0.8   # least-negative sweep voltage (just below turn-on)
nvled_v_coarse_stop: -2.6   # most-negative sweep voltage (below saturation knee)
n_coarse: 26   # coarse pre-sweep points
coarse_settle_ms: 6.0
coarse_n_smu: 4
low_current_target_a: 1.0e-06   # lowest LED current the sweep targets (~J 1, the rise foot)
high_current_frac: 0.97
n_fine: 30   # fine voltage-sweep points. Lowered from 45 once the settle time was measured: the dwell
             # dominates the budget, so fewer points with a real settle beat more that never settled.
lowj_weight: 1.5   # >1 concentrates fine points toward LOW current (the SRH rising side J≈1–5 that pins ...
vramp_knee_v: -1.3   # split voltage between the dense (rising) and sparse (droop) halves
vramp_low_frac: 0.6   # fraction of points placed in the rising-side segment
sweep_direction: "high_to_low"   # "low_to_high" | "high_to_low"

# ---- Pixel warm-up / conditioning ----
warmup_ms: 1500.0   # 0 = off. Dwell at WARMUP_NVLED_V before each sweep.
warmup_nvled_v: -2.6   # warm-up bias (high current, clears the parasitic)
warmup_diag_v: -0.85   # ≈J 1: stresses current readout, light still > dark
warmup_diag_n_pixels: 3   # how many of the selected pixels to characterise
warmup_diag_seconds: 30.0   # log duration per phase (fresh turn-on / conditioned)
warmup_diag_nplc: 1.0
warmup_diag_n_smu: 8
warmup_diag_n_pm: 4

# ---- Adaptive per-point effort by current zone ----
adaptive_threshold_a: 1.0e-05   # 10 µA: boundary between the low-J and high-J zones
lowj_nplc: 2.0
lowj_n_pm: 8
lowj_n_smu: 16   # low J: integrate the CURRENT harder
highj_nplc: 0.5
highj_n_pm: 4
highj_n_smu: 8   # high J: fast
lowj_settle_ms: 200.0
highj_settle_ms: 15.0   # fine low-J range needs more settle time

# ---- Instruments ----
pm400_addr: "USB0::0x1313::0x8075::P5006526::INSTR"
smu_addr: "USB0::0x05E6::0x2602::4649721::INSTR"

# ---- PM400 ----
pm_wavelength: 440.0
pm_range: 1.0e-07   # W, fixed (no autorange)
pm_averaging: 3   # internal averaging per reading

# ---- VLED (ch A) — constant LED anode drive ----
vled_voltage: 1.8
vled_compliance: 1.0
vled_range_i: 0.01

# ---- NVLED (ch B) — voltage-mode current range ----
nvled_compliance: 1.0e-05   # current compliance. In High-C this ALSO selects the measure range, so it
                            # sets the noise floor. The sweep overrides it per segment below.
nvled_range_i: 0.01   # default fixed measure current range (coarse pre-sweep, fast scan, and any point with ...
perpoint_range: false   # False = fixed NVLED_RANGE_I (10 mA): consistent (offsets and all) so the curve SHAPE ...
probe_range_i: 0.001   # wide probe range: covers the device max (~175 µA), never overflows, gives the ...
probe_n_smu: 4   # quick samples for the magnitude probe
range_settle_ms: 50.0   # settle after a measure-range change before reading
highc_b: true   # MANDATORY (measured 261013). Without High-C every reading below ~10 uA is a range
                # artifact: 42-58% of whatever range is selected, independent of bias, wrong by up to 517x.
sweep_autozero: "AUTO"   # AUTO | ONCE | OFF
save_raw_samples: true   # Save every individual burst sample (not just the per-point summary) to a raw-samples ...

# ---- Integration time (NPLC) per phase ----
fastscan_nplc: 0.05   # Now the fast-scan CURRENT matters: at −1.35 V the fast scan is a full-coverage ...
fastscan_n_smu: 4   # SMU samples/pixel in the fast scan
coarse_nplc: 0.1   # voltage-mode coarse I(V) map: rough, quick
sweep_nplc: 1.0   # the accurate IQE data (raise toward 2–5 for very low J)

# ---- Settle + averaging ----
settle_ms: 15.0   # wait after each setpoint before averaging
fastscan_settle_ms: 10.0   # fast scan settle after lighting a pixel. Back to 10 ms (was 5) — the 5 ms save wasn't ...
fastscan_random_order: true   # visit fast-scan pixels in a shuffled order (not a raster). A raster correlates any ...
fastscan_order_seed: 0   # seed for the shuffle (reproducible)
fastscan_blank_between: true   # send a black (all-off) frame before lighting each pixel, so exactly ONE pixel is ever ...

# ---- Dead-pixel early abort (voltage sweep) ----
dead_abort: true   # Liveness is gated by the fast scan, which has an optical background floor that can ...
dead_abort_nw: 2.0   # absolute floor (nW): first-point power below this ⇒ dead
dead_abort_frac: 0.1   # or below this fraction of the running median of live pixels
thermal_settle_ms: 100.0   # before the fine sweep, sit at the FIRST point this long so the pixel reaches its ...
n_smu_samples: 8   # SMU samples averaged per point
n_pm_samples: 12   # PM400 readings averaged per point

# ---- Per-segment effort (fine_sweep_mode="voltage") ----
# SETTLE TIMES ARE SECONDS. After a voltage step the current approaches its final value as a POWER LAW,
# |I-Iinf| ~ t^-1.3, so 1% takes 5-55 s and 0.1% takes 60-80 s -- at EVERY step size from 20 mV to 200 mV.
# Small steps do NOT settle faster: 20 mV onto -0.80 V was still 4.5% high and drifting at 80 s, while
# 200 mV onto the same point was flat from 60 s. The budget is the DWELL, not the step size.
settle_scale: 1.0   # multiplies every sweep settle. --simulate forces 0. Lower it on hardware only to
                    # measure what the shortcut costs; it costs the rising side.
vramp_perseg_effort: true   # The knee (VRAMP_KNEE_V) splits point DENSITY, measurement EFFORT and the LIMIT.
vramp_lowv_nplc: 2.0        # integer NPLC, so mains is nulled by the integration window
vramp_lowv_n_pm: 32
vramp_lowv_n_smu: 12
vramp_lowv_settle_s: 8.0      # rising side: 1% needs 5-55 s
vramp_lowv_limit_a: 1.0e-05   # the rising side never exceeds ~5 uA
vramp_highv_nplc: 1.0       # was 0.5 -- not an integer, so it nulled no mains at all
vramp_highv_n_pm: 8
vramp_highv_n_smu: 8
vramp_highv_settle_s: 2.0     # droop side: big currents, the relaxation is a smaller fraction
vramp_highv_limit_a: 0.001    # -2.6 V draws ~175 uA, far above the rising-side limit

# ---- Leakage reference (the low-J correction) ----
# ch B reads the TOTAL cathode current. Measured over 12 pixels in 4 quadrants: the reference is 8% of the
# reading at -0.95 V and 58% at -0.80 V. Without the subtraction the EQE appears to collapse 20x on the
# rising side. The reference is the SAME pixel at bitval 0 -- a BLANKED frame draws ~4x MORE and is invalid.
leak_reference: true
leak_ref_bitval: 0        # addressed, but not driven
leak_ref_settle_s: 2.0    # only the drive changes, not the bias

# ---- Dead-pixel threshold (fast scan) ----
nvled_v_fastscan: -1.35   # single fast-scan bias — does DOUBLE duty. At −1.35 V the pixels sit at J≈25 A/cm², ...
dead_threshold_frac: 0.2   # a pixel is alive if P ≥ this × the "typical lit" level
fastscan_alive_pctl: 90   # "typical lit" level = this percentile of the fast-scan power. NOT the median: the ...
pixel_area_um2: 100.0
smu_display_off: false

