# NOT THE STANDARD CONFIG. See configs/standard.yaml for that.
#
# The PRE-261014 sweep settings, kept so the old method can be run head to head.
#
#   python -m measure_iqe --config legacy_settings.yaml --out D:\ab_old
#   python -m measure_iqe                                --out D:\ab_new
#
# Same pixels, same ROI, same array: the only difference is the measurement method.
# Expect the old run to be FASTER and WRONG on the rising side. See
# SMILE_IQE_Analysis/INVESTIGATION_REPORT.md for what each line costs.

highc_b: false            # the SMU then reads a fixed fraction of its range (report 1)
nvled_compliance: 0.5     # the old compliance: no range control at all
nvled_range_i: 0.01       # the fixed 10 mA range every historical run used
perpoint_range: false

leak_reference: false     # no bitval-0 reference, so I_LED is the TOTAL cathode current

vramp_lowv_settle_s: 0.02    # the old 20 ms, in the new units
vramp_highv_settle_s: 0.015  # the old 15 ms
vramp_lowv_limit_a: 0.5      # no per-segment limit either
vramp_highv_limit_a: 0.5

vramp_lowv_nplc: 2.0
vramp_highv_nplc: 0.5     # not an integer: no mains rejection
n_fine: 45                # the old point count

# Everything else stays at the new defaults so the comparison isolates the method.
