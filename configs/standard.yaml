# THE STANDARD CONFIG for measure_iqe: a readable, annotated copy of the defaults.
#
# !! EDITING THIS FILE CHANGES NOTHING ON ITS OWN. !!
# measure_iqe reads its defaults from measure_iqe/config.py, not from here, and only
# loads this file if you pass --config. A test asserts the two stay identical, so an
# edit here will make the test suite fail rather than take effect.
#
# To change something for a run, in increasing order of permanence:
#   --set key=value                      one run
#   --array NAME                         that array's measured calibration (see below)
#   --config my.yaml                     a copy of this file with your edits
#   edit measure_iqe/config.py           the default for everyone
#
#   python -m measure_iqe                                  # identical to this file
#   python -m measure_iqe --config configs/standard.yaml   # same, explicitly
#   IQEConfig.from_file("configs/standard.yaml")
#
# The other files in configs/ are NOT the standard:
#   legacy_pre261014.yaml  the old, wrong method, kept so it can be run head to head
#
# Per-array numbers (the settle times, the current limits) should come from
# `--calibrate` rather than from edits here -- they are properties of the array, not
# of the method:
#
#   python -m measure_iqe --calibrate --array Array42_IQE --out D:\cal   # once
#   python -m measure_iqe --array Array42_IQE                            # every run after
#
# The second form sets sample_name AND applies calibrations/Array42_IQE.yaml. That
# directory is gitignored, so re-copying the repo never overwrites your calibrations.
#
# EVERY key is optional: leave one out and the default in measure_iqe/config.py
# applies. An unknown key or a wrong type is a hard error, so a typo can never be
# silently ignored. The values below ARE the defaults, so this file reproduces a
# stock run. Full parameter reference: README.md -> Configuration reference.


# ---- Run identity & output ----
sample_name: "Array42_IQE"   # base_dir is relative to the working directory unless you pass an absolute path. ...
base_dir: "results"   # output root; a timestamped run dir is created inside

# ---- ROI & pixel selection ----
roi: [32, 32, 63, 63]   # (x1,y1,x2,y2) or "FULL"/"TL"/"TR"/"BL"/"BR"
sweep_select: "blocks"   # "blocks" | "spatial" | "stride"
block_size: 8   # blocks mode: block edge in pixels (ROI → ~ROI/BLOCK_SIZE blocks/axis)
pixels_per_block: 4   # blocks mode: alive pixels sampled per block
block_seed: 0   # blocks mode: RNG seed (vary across runs to sample new pixels)

# ── Pooled clusters: K pixels lit together, swept as one target ──────────────
# OFF by default and deliberately so. A pooled row is not a pixel: it reports the SUM
# of its members' light and the SUM of their current. Turning it on is a choice about
# what the run is for.
#
# Why it exists: open question 1, the optical floor. The PM400 dark reading wanders
# 75 pW under a 210 pW signal and faint-end power scatters 8.5-8.9 % under BOTH sweep
# methods, so the suspect is the meter, not the method. K members emit K x the light
# while the drift stays put, and set_pixels writes them in ONE frame instruction -- so
# a pooled point costs exactly what a single point costs. K pixels per dwell, not one.
#
# The intended shape is BOTH in one run: the single pixels stay exactly as they are and
# the pooled groups are added on top, so the singles ground the pooled numbers under
# the same lamp, thermal history and instrument state. For example 20 singles plus 50
# pooled groups:
#     --set pixels_per_block=1 --set block_size=114 --set pool_clusters=50
#
# Pooled EQE = sum(P)/sum(I) is a CURRENT-WEIGHTED mean of the members, not the mean of
# their EQEs. The two differ whenever brightness and current correlate across members.
pool_clusters: 0   # pooled groups swept IN ADDITION to the single pixels. 0 = off.
pool_size: 4       # members per group. 4, not 16, for two measured reasons.
                   # DETECTION: a dead or dim member is a 1/K deficit against a sum
                   # whose own spread is 16.4%/sqrt(K) (the array's measured alive-pixel
                   # brightness spread, 52.21 +- 8.55 nW over 261 441 pixels, run
                   # 261015-0015). That is 3.0 sigma at K=4 and 1.5 sigma at K=16, so
                   # above ~4 a pooled reading cannot tell "one member died" from "these
                   # members are dim".
                   # COMPLIANCE, the harder cap: K members draw K x the current and
                   # pick_limit's ladder stops at vramp_highv_limit_a. At the measured
                   # 117.7 uA per pixel at -2.60 V a 1 mA ceiling clamps at K=8, and a
                   # clamped point is the instrument's current, not the device's. The
                   # selection estimates this from the fast scan and warns before the
                   # sweep starts.
pool_seed: 1       # separate RNG stream from block_seed, so the pooled members are
                   # never the single pixels. Sharing one would make the grounding
                   # comparison circular.
min_pixel_separation: 2   # blocks mode: no two measured pixels may sit closer than this (Chebyshev, so 2 = never ...
sweep_fraction: 0.1   # spatial mode: fraction of ALIVE pixels to sweep
min_sweep_pixels: 6   # spatial mode: floor on the count (so tiny ROIs still map)
nth_pixel_sweep: 5   # stride mode: sweep every Nth alive pixel
max_sweep_pixels: 40   # hard cap (spatial/stride only; blocks controls its own count)
fastscan_bitval: 15   # bitval for the alive/dead fast scan (brightest)

# ---- Source mode ----
source_mode: "voltage"   # "voltage": ch B sources voltage, adaptive current-targeted sweep. PROVEN on Array42 — ...

# ---- Current-source sweep (source_mode = "current") ----
current_sweep_low_a: 3.0e-07   # lowest LED current setpoint (1 µA → J ≈ 1)
current_sweep_high_a: 0.00012   # highest setpoint (~120 µA; capped by V compliance)
current_sweep_n: 50   # log-spaced current setpoints
nvled_v_limit: 3.2   # |voltage| compliance while sourcing current (V)
current_sweep_bitval: 15   # single bitval — CMOS fully open, we set I directly
current_source_range_i: 0.001   # fixed source current range (covers 120 µA; gives good low-current resolution). Tune on ...
measure_v_range: 6.0   # ch B voltage measure range (covers ±3.2 V)

# ---- Voltage-source sweep (source_mode = "voltage", DEFAULT) ----
bitvals: [15]   # single bitval — densify low-J via spacing instead
fine_sweep_mode: "voltage"   # Fine-sweep mode: "voltage" — plain UNIFORM voltage ramp NVLED_V_COARSE_START → STOP ...
nvled_v_coarse_start: -0.8   # least-negative sweep voltage (just below turn-on)
nvled_v_coarse_stop: -2.6   # most-negative sweep voltage (below saturation knee)
n_coarse: 26   # coarse pre-sweep points
coarse_settle_ms: 6.0
coarse_n_smu: 4
low_current_target_a: 1.0e-06   # lowest LED current the sweep targets (~J 1, the rise foot)
high_current_frac: 0.97
n_fine: 30   # fine voltage-sweep points. Lowered from 45 once the settle time was measured: the dwell
             # dominates the budget, so fewer points with a real settle beat more that never settled.
lowj_weight: 1.5   # >1 concentrates fine points toward LOW current (the SRH rising side J≈1–5 that pins ...
vramp_knee_v: -1.3   # split voltage between the dense (rising) and sparse (droop) halves
vramp_low_frac: 0.6   # fraction of points placed in the rising-side segment
sweep_direction: "high_to_low"   # "low_to_high" | "high_to_low"

# ---- Pixel warm-up / conditioning ----
warmup_ms: 1500.0   # 0 = off. Dwell at WARMUP_NVLED_V before each sweep.
warmup_nvled_v: -2.6   # warm-up bias (high current, clears the parasitic)
warmup_diag_v: -0.85   # ≈J 1: stresses current readout, light still > dark
warmup_diag_n_pixels: 3   # how many of the selected pixels to characterise
warmup_diag_seconds: 30.0   # log duration per phase (fresh turn-on / conditioned)
warmup_diag_nplc: 1.0
warmup_diag_n_smu: 8
warmup_diag_n_pm: 4

# ---- Adaptive per-point effort by current zone ----
adaptive_threshold_a: 1.0e-05   # 10 µA: boundary between the low-J and high-J zones
lowj_nplc: 2.0
lowj_n_pm: 8
lowj_n_smu: 16   # low J: integrate the CURRENT harder
highj_nplc: 0.5
highj_n_pm: 4
highj_n_smu: 8   # high J: fast
lowj_settle_ms: 200.0
highj_settle_ms: 15.0   # fine low-J range needs more settle time

# ---- Instruments ----
pm400_addr: "USB0::0x1313::0x8075::P5006526::INSTR"
smu_addr: "USB0::0x05E6::0x2602::4649721::INSTR"

# ---- PM400 ----
pm_wavelength: 440.0
pm_range: 1.0e-07   # W, fixed (no autorange)
pm_averaging: 3   # internal averaging per reading

# ---- VLED (ch A) — constant LED anode drive ----
vled_voltage: 1.8
vled_compliance: 1.0
vled_range_i: 0.01

# ---- NVLED (ch B) — voltage-mode current range ----
nvled_compliance: 1.0e-05   # current compliance. In High-C this ALSO selects the measure range, so it
                            # sets the noise floor. The sweep overrides it per segment below.
nvled_range_i: 0.01   # default fixed measure current range (coarse pre-sweep, fast scan, and any point with ...
perpoint_range: false   # False = fixed NVLED_RANGE_I (10 mA): consistent (offsets and all) so the curve SHAPE ...
probe_range_i: 0.001   # wide probe range: covers the device max (~175 µA), never overflows, gives the ...
probe_n_smu: 4   # quick samples for the magnitude probe
range_settle_ms: 50.0   # settle after a measure-range change before reading
highc_b: true   # MANDATORY (measured 261013). Without High-C every reading below ~10 uA is a range
                # artifact: 42-58% of whatever range is selected, independent of bias, wrong by up to 517x.
sweep_autozero: "AUTO"   # AUTO | ONCE | OFF
save_raw_samples: true   # Save every individual burst sample (not just the per-point summary) to a raw-samples ...

# ---- Integration time (NPLC) per phase ----
fastscan_nplc: 0.05   # Now the fast-scan CURRENT matters: at −1.35 V the fast scan is a full-coverage ...
fastscan_n_smu: 4   # SMU samples/pixel in the fast scan
coarse_nplc: 0.1   # voltage-mode coarse I(V) map: rough, quick
sweep_nplc: 1.0   # the accurate IQE data (raise toward 2–5 for very low J)

# ---- Settle + averaging ----
settle_ms: 15.0   # wait after each setpoint before averaging
fastscan_settle_ms: 10.0   # fast scan settle after lighting a pixel. Back to 10 ms (was 5) — the 5 ms save wasn't ...
fastscan_random_order: true   # visit fast-scan pixels in a shuffled order (not a raster). A raster correlates any ...
fastscan_order_seed: 0   # seed for the shuffle (reproducible)
fastscan_blank_between: true   # send a black (all-off) frame before lighting each pixel, so exactly ONE pixel is ever ...

# ---- Dead-pixel early abort (voltage sweep) ----
dead_abort: true   # Liveness is gated by the fast scan, which has an optical background floor that can ...
dead_abort_nw: 2.0   # absolute floor (nW): first-point power below this ⇒ dead
dead_abort_frac: 0.1   # or below this fraction of the running median of live pixels
thermal_settle_ms: 100.0   # before the fine sweep, sit at the FIRST point this long so the pixel reaches its ...
n_smu_samples: 8   # SMU samples averaged per point
n_pm_samples: 12   # PM400 readings averaged per point

# ---- Per-segment effort (fine_sweep_mode="voltage") ----
# SETTLE TIMES ARE SECONDS. After a voltage step the current approaches its final value as a POWER LAW,
# |I-Iinf| ~ t^-1.3, so 1% takes 5-55 s and 0.1% takes 60-80 s -- at EVERY step size from 20 mV to 200 mV.
# Small steps do NOT settle faster: 20 mV onto -0.80 V was still 4.5% high and drifting at 80 s, while
# 200 mV onto the same point was flat from 60 s. The budget is the DWELL, not the step size.
settle_scale: 1.0   # multiplies every sweep settle. --simulate forces 0. Lower it on hardware only to
                    # measure what the shortcut costs; it costs the rising side.
vramp_perseg_effort: true   # The knee (VRAMP_KNEE_V) splits point DENSITY, measurement EFFORT and the LIMIT.
vramp_lowv_nplc: 2.0        # integer NPLC, so mains is nulled by the integration window
vramp_lowv_n_pm: 32
vramp_lowv_n_smu: 12
vramp_lowv_settle_s: 8.0      # rising side: 1% needs 5-55 s
vramp_lowv_limit_a: 1.0e-05   # the rising side never exceeds ~5 uA
vramp_highv_nplc: 1.0       # was 0.5 -- not an integer, so it nulled no mains at all
vramp_highv_n_pm: 8
vramp_highv_n_smu: 8
vramp_highv_settle_s: 2.0     # droop side: big currents, the relaxation is a smaller fraction
vramp_highv_limit_a: 0.001    # -2.6 V draws ~175 uA, far above the rising-side limit

fastscan_limit_a: 0.001   # compliance for the FAST SCAN, a different operating point from the sweep.
                          # At -1.35 V a pixel draws ~30 uA, so the sweep's 10 uA rising-side limit
                          # clamps EVERY pixel (measured 261014-0048: all 1024 read exactly 10.00 uA).

# ---- Settling traces ----
# The sweep waits the dwell and then integrates for ~0.5 s: at a 65 s settle that is
# 99.3% dead time, and the transient was being discarded. Polling through a wait that is
# already being paid for costs NO bench time and changes no reported value -- the value
# is still the burst taken at the end. What it buys is the data to answer offline:
#   * can the settled value be extrapolated from the first seconds, so the dwell can be
#     cut? (the decay is a power law t^-1.3, so fit I_inf on the basis {1, t^-n})
#   * does EQE = P/I settle faster than either, because both relax with the same carrier
#     population? If so the dwell only has to fix the J axis, not the efficiency.
trace_settling: true
trace_settling_period_s: 0.25
trace_settling_n_pm: 2
trace_settling_n_smu: 2
trace_settling_min_s: 2.0   # skip for short dwells: nothing to see

# ---- Per-array calibration (--calibrate) ----
# The settle time is a property of the ARRAY, so measure it per array.
# array may need far more or far less, and it does NOT follow from C, because the
# settling is a charge relaxation and not an RC charge. Measure it, do not inherit it:
#   python -m measure_iqe --calibrate --out D:\cal
#   python -m measure_iqe --calibration "D:\cal\...\<array>_calibration.yaml"
calibrate_pixels: 3        # pixels to characterise; the worst case sets the dwell
calibrate_seconds: 40.0    # poll each bias this long. Shorter than the real settle time
                           # makes the answer a lower bound, and the file says so.
calibrate_n_smu: 4
calibrate_period_s: 0.05   # poll interval, and the floor on what can be resolved
calibrate_target: 0.01     # how close to the final value counts as settled. THE SPEED KNOB:
                           # the settling is a power law, so the dwell scales as
                           # target^(-1/1.3) -- 0.03 is 2.3x faster than 0.01, 0.05 is 3.4x.
calibrate_approach_steps: 3   # sweep-sized steps before each measured one, so the capture
                              # sees the step the sweep takes and the range the sweep uses
calibrate_approach_s: 5.0     # dwell on each approach step
calibrate_margin: 1.5      # safety factor: 3 biases are measured, 30 are swept

resume: false              # --resume RUN_DIR sets this; skip the pixels a killed run
                           # already finished and append to its files

# ---- Leakage reference (the low-J correction) ----
# ch B reads the TOTAL cathode current. Measured over 12 pixels in 4 quadrants: the reference is 8% of the
# reading at -0.95 V and 58% at -0.80 V. Without the subtraction the EQE appears to collapse 20x on the
# rising side. The reference is the SAME pixel at bitval 0 -- a BLANKED frame draws ~4x MORE and is invalid.
leak_reference: true
leak_ref_bitval: 0        # addressed, but not driven. MUST be 0 when leak_ref_tries > 1:
                          # the retry gate below is OPTICAL, and bitval 1 emits 11.6% of
                          # bitval 15 at -2.60 V, so a non-zero reference would retry
                          # every point to the limit. config.validate() refuses it.
leak_ref_settle_s: 2.0    # only the drive changes, not the bias. Ample at both ends:
                          # the leakage settles in 0.53 s at -0.85 V and shows no
                          # transient at all at -1.30 or -1.80 V (sections 20, 21).
leak_ref_tries: 3         # the FPGA drops the bitval-0 frame write intermittently, in
                          # both directions, so the reference is verified optically and
                          # the frame re-written up to this many times. Counted over 128
                          # writes it has never fired: the 95% upper bound on the
                          # per-write failure rate is 2.3% (section 21). Every run before
                          # 16 October 2026 predates it and carries the uncorrected rate.
leak_ref_max_frac: 0.25   # retry while P_REF / P_lit exceeds this. The margin is a BIAS
                          # effect, not a write-failure one: the worst of 128 points was
                          # 8.9% at -0.80 V, and that is P_lit falling to 0.22 nW rather
                          # than P_REF rising. A sweep extended fainter trips this gate
                          # on physics (section 21).
leak_ref_per_point_above_v: -1.0   # measure the reference PER POINT above this bias,
                          # reuse one cached per-pixel value at or below it. Per-point
                          # references cost 2.4 h of run 261015-0015's 4.82 h. The leak
                          # is NOT constant -- it rises 256.5 -> 286.1 nA from -0.80 to
                          # -2.36 V -- but the signal rises 728x over the same span, so
                          # one fixed per-pixel value costs 0.03-0.13% from -0.83 V down
                          # and 0.20% at -2.60 V, where the array starts to conduct.
                          # Above -1.0 V the reference is 5-62% of the reading, so those
                          # eight biases keep their own. Saves 2100 of 3000 reads = 35%
                          # of the sweep. null = reference every point, as before.
leak_ref_prepass_v: -0.9  # the one bias the per-pixel cache is measured at, in a pass
                          # before the sweep. Faint side on purpose: the burst sem there
                          # is 0.13 nA against 9.06 nA on the 1e-3 range, and that
                          # precision carries to all 22 biases that reuse it. It cannot
                          # piggyback on the first bias -- under high_to_low that is
                          # -2.60 V, whose reference is the 495-745 nA outlier, and
                          # anchoring there costs 0.16-0.41% instead of 0.14%.

# ---- Dead-pixel threshold (fast scan) ----
nvled_v_fastscan: -1.35   # single fast-scan bias — does DOUBLE duty. At −1.35 V the pixels sit at J≈25 A/cm², ...
fastscan_voltages: []     # EXTRA fast-scan biases; nvled_v_fastscan is always first and
                          # is the only one alive/dead and pixel selection are judged on,
                          # so adding biases cannot change which pixels get swept. Each
                          # extra bias is another full pass over the ROI, sharing the one
                          # fastscan_limit_a. Worth setting because -1.35 V is 0.30 V off
                          # the measured peak: over the 100 pixels of 261015-0015 peak EQE
                          # sits at -1.05 V and the proxy ranks pixels at Spearman 0.890
                          # against the sweep, where -1.05 V gives 0.989. For example:
                          # [-1.05, -1.65] measures the peak and both shoulders in one run.
dead_threshold_frac: 0.2   # a pixel is alive if P ≥ this × the "typical lit" level
fastscan_alive_pctl: 90   # "typical lit" level = this percentile of the fast-scan power. NOT the median: the ...
pixel_area_um2: 100.0
smu_display_off: false

# ---- Derived / helpers ----

# ---- Serialisation ----
calibration_source: ""    # set BY the run, not by you: --array NAME fills it with the
                          # calibrations/NAME.yaml that was applied, so the saved
                          # *_config.json names the file that produced the run.

# --- loop order (section 15) ------------------------------------------------------
# WHICH LOOP IS OUTSIDE. The single biggest lever on run time.
#   pixel_major  for pixel: for bias: settle, measure      (the original)
#   bias_major   for bias:  settle once; for pixel: measure
# The dwell is paid for the BIAS change, not the pixel change: one global 42.8 uF on the
# common cathode, and the frame only picks the driven row/column. 100 pixels x 30
# points: 31.0 h -> 3.6 h, and that part stands.
#
# The cost of the frame change itself was WRONG in this file until 16 October 2026. It
# said "under 0.5% and is over at once" and "measured need is under 1 s", both from run
# 261014-2223, which referenced a capture to its own still-moving 20 s tail and so could
# not see anything slower than 20 s. What the 122 s records say (sections 20-22):
#   * NPLC 0.01: -9.16% at 0-5 ms, ~200 ms to recover. A single NPLC 1.0 integration
#     over that window reports -5.7% of it and the old 500-sample trace saw nothing.
#   * NPLC 1.0: still -0.42 to -0.58% at 2 s at three biases, reaching 0.1% only at
#     60-90 s. "Over at once" is false by four decades.
#   * the LIGHT does not follow: at -1.05 V the current is 1.0% low at 0-0.5 s and the
#     light is +0.03%. The fast part is NON-RADIATIVE, so EQE at 2 s reads +0.50% HIGH,
#     not 0.5% low. Every earlier number here was a statement about the current only.
sweep_order: pixel_major
pixel_switch_settle_s: 2.0   # bias_major only: the wait after a frame change. Leave it
                             # at 2 s -- not because the transient is over (it is not)
                             # but because the part you would wait out is non-emissive:
                             # 20 s buys 0.24 pp of current and 0.07 pp of EQE, at 10x
                             # the switch cost. bias_major therefore carries a known
                             # one-signed +0.5% EQE surplus on the faint side. Subtract
                             # it, or use pixel_major (sections 17, 21, 22).
sweep_rotate: 0              # rotate the MEASUREMENT ORDER by N, same pixels. Built to
                             # test whether bias_major's slot 0 was special. It is not:
                             # the clean pixel followed the PIXEL through the rotation
                             # (section 17, run 261015-1225), which withdrew every
                             # loop-position claim in section 15. Keep at 0.
bias_major_precondition: false  # one conditioning pass at the brightest bias before the
                             # first bias, to test whether a cold pixel reads low.
                             # Measured: it changes nothing, -3.02% against -2.99%
                             # (section 17, run 261015-1321). Keep false.
