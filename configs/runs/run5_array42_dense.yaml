# Run 5 (Array42): a dense bias grid on 400 pixels of the 1703 sweep, for the excess-voltage
# analysis (analysis/led_voltage_budget.py). 1703 had only 6 usable biases between 0.6 uA and the
# transistor limit (-0.9, -0.95, -1.0, -1.2, -1.4, -1.6 V; -2.0 V is already transistor-limited).
# This has 22 there: 0.05 V steps from -0.85 to -1.9 V. It decides whether the excess is one
# barrier plus a resistor, and per pixel how much of each.
# A reference at every bias, three tries: 1703 had one try, and 22 327 of its references at
# -0.8 to -1.0 V were taken with the pixel still partly lit. References from -0.5 V on (as on
# Array38) give the light ideality at nA on the same pixels.
# Pixels: configs/runs/a42_dense.csv (made from results/comparisons/led_voltage/per_pixel_Array42.csv): 50 of R_best's best 2 %, the 50 with the most excess at
# 20 uA, 300 random. Estimate first: --estimate. Expect about 1 h.
pixel_list: "configs/runs/a42_dense.csv"
sweep_voltages: [-3.2, -2.2, -2.0, -1.9, -1.85, -1.8, -1.75, -1.7, -1.65, -1.6, -1.55, -1.5, -1.45,
                 -1.4, -1.35, -1.3, -1.25, -1.2, -1.15, -1.1, -1.05, -1.0, -0.95, -0.9, -0.85,
                 -0.8, -0.75, -0.7, -0.65, -0.6, -0.5]
leak_ref_per_point_above_v: null
leak_ref_skip_above_v: -0.45
leak_ref_tries: 3
# ---- the same acquisition settings as Array42 261102-1703 (its Sweep_config.json) ----
sweep_read_vled: false
highc_b: false
pixel_switch_settle_s: 0.005
vramp_lowv_nplc: 1.0
vramp_lowv_n_pm: 6
vramp_lowv_n_smu: 2
vramp_lowv_settle_s: 60.0
vramp_highv_nplc: 0.05
vramp_highv_n_pm: 3
vramp_highv_n_smu: 4
vramp_highv_settle_s: 10.0
leak_ref_prepass_reads: 1
leak_ref_settle_s: 0.01
nvled_v_fastscan: -1.4
